name: "🚀 Release"

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: ✅ Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: 📦 Cache Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            !~/.nuget/packages/**/content
            !~/.nuget/packages/**/contentFiles
          key: ${{ runner.os }}-dotnet-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-

      - name: ⬇️ Restore Dependencies
        run: dotnet restore

      - name: 🏗️ Build
        run: dotnet build -c Release --no-restore

      - name: 🎁 Package
        run: dotnet pack -c Release --no-build --property:PackageOutputPath=../../nupkgs

      - name: ⬆️ Push to NuGet
        run: dotnet nuget push "./nupkgs/*.nupkg" --skip-duplicate --source "https://api.nuget.org/v3/index.json" --api-key ${{ secrets.NUGET_PUBLISH_KEY }}

      - name: 📖 Read Release Notes
        id: release-notes
        run: |
          NOTES=$(sed -n '/^## 🚀/,/^## /p' resources/RELEASE_NOTES.md | head -n -1)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📌 Extract Version
        id: version
        run: |
          VERSION=$(grep '<Version>' Directory.Build.props | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: 🏷️ Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: 🎉 Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          body: ${{ steps.release-notes.outputs.notes }}
          makeLatest: 'true'
