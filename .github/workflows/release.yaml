name: "🚀 Release"

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: ✅ Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: 📦 Cache Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            !~/.nuget/packages/**/content
            !~/.nuget/packages/**/contentFiles
          key: ${{ runner.os }}-dotnet-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-

      - name: ⬇️ Restore Dependencies
        run: dotnet restore

      - name: 🏗️ Build
        run: dotnet build -c Release --no-restore
        
      - name: 🎁 Package
        run: dotnet pack -c Release --no-build --property:PackageOutputPath=../../nupkgs

      - name: 🏷️ Resolve Package Version
        id: package-version
        run: |
          PACKAGE_VERSION="$(dotnet msbuild ./src/Hussy.Net/Hussy.Net.csproj -nologo -getProperty:Version)"
          if [ -z "${PACKAGE_VERSION}" ]; then
            echo "Unable to resolve package version."
            exit 1
          fi
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
        
      - name: ⬆️ Push to NuGet
        run: dotnet nuget push "./nupkgs/*.nupkg" --skip-duplicate --source "https://api.nuget.org/v3/index.json" --api-key ${{ secrets.NUGET_PUBLISH_KEY }}

      - name: 🎉 Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.package-version.outputs.version }}
          allowUpdates: 'true'
          generateReleaseNotes: 'true'
          makeLatest: 'true'
